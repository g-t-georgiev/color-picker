<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>VS Code Style Color Picker</title>
  <style>
    /* External styling example */
    body {
      box-sizing: border-box;
      background: #1e1e1e;
      color: #ccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      margin: 0;
    }

    /* You can override exposed CSS variables from the outside */
    color-picker-button {
      --picker-trigger-size: 36px;
    }
  </style>
</head>

<body>
  <color-picker-button value="#007acc"></color-picker-button>

  <script type="module" src="../src/index.ts"></script>
  <script>
    const colorPickerBtn = document.querySelector("color-picker-button");
    colorPickerBtn?.addEventListener("color-changed", (ev) => {
      console.log(`Color changed to ${JSON.stringify(ev.detail)}`);
    });
  </script>
</body>

</html>
