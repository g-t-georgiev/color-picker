<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>VS Code Style Color Picker</title>
  <style>
    /* External styling example */
    body {
      background: #1e1e1e;
      color: #ccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 50px;

      justify-content: center;
